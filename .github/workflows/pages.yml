# Publishes the install guide, the userscript and its meta file to GitHub Pages.
# Pages stays switched off until the repository is public; this runs once it is enabled
# (Settings > Pages > Source: GitHub Actions).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # The runner's own Node is enough: the scripts use only Node built-ins.
      - name: Test release tooling
        run: node --test scripts/*.test.mjs
      - name: Build the site
        run: node scripts/build-pages.mjs _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
